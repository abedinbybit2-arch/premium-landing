<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/protect.js" defer></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create your AndroGRAM account and access the premium dashboard." />
  <meta name="theme-color" content="#05080c" />
  <title>Sign up — AndroGRAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop stop-color='%233ddc84'/><stop offset='1' stop-color='%2322d3ee'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='%05080c'/><circle cx='50' cy='50' r='28' fill='url(%23g)'/></svg>" />
</head>
<body>
  <div class="auth-loading" id="page-loader">
    <div class="spinner" aria-hidden="true"></div>
  </div>

  <div class="bg-layer" aria-hidden="true">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
  </div>

  <main class="auth-page">
    <div class="auth-card glass">
      <div class="auth-header">
        <a href="index.html" class="logo" aria-label="AndroGRAM Home">
          <span class="logo-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M7 9a5 5 0 0 1 10 0v7a3 3 0 0 1-3 3h-4a3 3 0 0 1-3-3V9z" fill="currentColor"/><circle cx="9.5" cy="11" r="1" fill="#04120a"/><circle cx="14.5" cy="11" r="1" fill="#04120a"/></svg>
          </span>
          <span class="logo-text">Andro<span>GRAM</span></span>
        </a>
        <h1>Create your account</h1>
        <p>Join AndroGRAM in under a minute</p>
      </div>

      <form id="signup-form" novalidate>
        <div class="form-error" id="form-error" role="alert"></div>

        <div class="form-group">
          <label for="name">Full name</label>
          <input class="form-input" type="text" id="name" name="name" autocomplete="name" required placeholder="Alex Rivera" />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input class="form-input" type="email" id="email" name="email" autocomplete="email" required placeholder="you@company.com" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password" autocomplete="new-password" required minlength="6" placeholder="At least 6 characters" />
        </div>

        <button type="submit" class="btn btn-primary btn-block auth-submit" id="submit-btn" data-ripple>
          <span class="btn-shine" aria-hidden="true"></span>
          <span class="btn-label">Sign Up</span>
        </button>
      </form>

      <p class="auth-footer">
        Already have an account? <a href="login.html">Log in</a>
      </p>
      <p class="auth-back">
        <a href="index.html">← Back to home</a>
      </p>
    </div>
  </main>

  <script type="module" src="js/signup.js"></script>
</body>
</html>
